name: Release

# 通过 tag 触发发布：v1.2.3 → stable（走 changesets publish，版本号由 changeset version 写入 package.json）
on:
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  stable:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # 发布门禁：tag 可打在任意 commit（含未过 CI 的），发布前强制 typecheck + 全量测试
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm changeset publish
