name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支连续 push/PR 时取消排队中的旧 run（release 的 concurrency 不带取消，发布不中断）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # 覆盖率观测：与 ci 并行，只收集 faapi 包（唯一配置了 coverage 的包），
  # 报告作为 artifact 上传供查看。不上传第三方服务；阈值等数据稳定后再设
  # （packages/faapi/vitest.config.ts thresholds 当前为 undefined，不会因此失败）
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faapi/faapi run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/faapi/coverage/
          retention-days: 14
