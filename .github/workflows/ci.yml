name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支连续 push/PR 时取消排队中的旧 run（release 的 concurrency 不带取消，发布不中断）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # 按包拆分并行：每个 job 独占 runner（public repo 标准 runner 为 4 vCPU / 16 GB），
  # 包间不再串行（根 test 的 --workspace-concurrency=1 是历史 OOM 的包级串行妥协，
  # 见提交 a3f7014）——内存天然隔离，等价于消除了包间 OOM 竞争
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [faapi, agent, mcp, schema, next]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faapi/${{ matrix.pkg }} run test

  # 覆盖率观测：与 test 并行，只收集 faapi 包（唯一配置了 coverage 的包），
  # 报告作为 artifact 上传供查看。不上传第三方服务；阈值等数据稳定后再设
  # （packages/faapi/vitest.config.ts thresholds 当前为 undefined，不会因此失败）
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @faapi/faapi run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/faapi/coverage/
          retention-days: 14
